plugins { id 'com.android.application' }

def repo = rootProject.projectDir.toPath().resolve('../..').normalize().toFile()
layout.buildDirectory = file("${repo}/android/build/farm-game")

android {
  namespace 'app.kinnect.live'
  compileSdk 36
  buildToolsVersion '36.0.0'
  defaultConfig {
    applicationId 'app.kinnect.farm'
    minSdk 26
    targetSdk 36
    versionCode 2
    versionName '1.0.1'
  }
  signingConfigs {
    debug { storeFile file("${repo}/android/debug.keystore"); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    release { storeFile file("${repo}/work/play-signing/upload.jks"); storePassword System.getenv('KINNECT_PLAY_PASS'); keyAlias 'kinnect-upload'; keyPassword System.getenv('KINNECT_PLAY_PASS') }
  }
  buildTypes {
    debug { signingConfig signingConfigs.debug }
    release { signingConfig signingConfigs.release; minifyEnabled false; debuggable false }
  }
  sourceSets {
    main {
      manifest.srcFile "src/main/AndroidManifest.xml"
      java.srcDirs = ["src/main/java", "${repo}/android/app/src/main/java", "${repo}/android/app/src/play/java"]
      java.exclude { details -> details.file.absolutePath.replace('\\', '/').contains('/src/main/java/') && details.file.name.startsWith('ApkUpdate') }
      java.exclude { details -> details.file.absolutePath.replace('\\', '/').endsWith('/src/main/java/app/kinnect/live/Distribution.java') }
      res.srcDirs = ["${repo}/android/app/src/main/res", "src/main/res"]
      assets.srcDirs = ["${repo}/android/app/src/main/assets", "${repo}/android/build/play-gradle/assets"]
      jniLibs.srcDirs = ["${repo}/work/android-tools/deps/webrtc/jni"]
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
  packaging { jniLibs { useLegacyPackaging = false } }
}

dependencies {
  implementation files("${repo}/work/android-tools/deps/webrtc/classes.jar")
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'com.android.billingclient:billing:9.1.0'
}
