plugins {
 id 'com.android.application' version '8.13.2'
 id 'com.google.gms.google-services' version '4.4.2'
}
def repo = rootDir.toPath().resolve('../..').normalize().toFile()
layout.buildDirectory = file("${repo}/android/build/play-fcm-b142")
android {
 namespace 'app.kinnect.live'
 compileSdk 36
 buildToolsVersion '36.0.0'
 defaultConfig { applicationId 'app.kinnect.live'; minSdk 26; targetSdk 36; versionCode 142; versionName '1.2.29' }
 signingConfigs {
  debug { storeFile file("${repo}/android/debug.keystore"); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
  release {
   storeFile file(System.getenv('KINNECT_PLAY_KEYSTORE') ?: 'D:/Kinnect-Server/data/play-signing/upload.jks')
   storePassword System.getenv('KINNECT_PLAY_PASS') ?: 'android'
   keyAlias 'kinnect-upload'
   keyPassword System.getenv('KINNECT_PLAY_PASS') ?: 'android'
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false; debuggable false } }
 flavorDimensions = ['channel']
 productFlavors {
  play {
   dimension 'channel'
  }
  direct {
   dimension 'channel'
   ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
  }
 }
 sourceSets {
  main {
   manifest.srcFile "${repo}/android/build/play-gradle/AndroidManifest.xml"
   java.srcDirs = []
   res.srcDirs = ["${repo}/android/app/src/main/res"]
   assets.srcDirs = ["${repo}/android/app/src/main/assets"]
   jniLibs.srcDirs = ["${repo}/work/android-tools/deps/webrtc/jni"]
  }
  play {
   java.srcDirs = ["${repo}/android/app/src/main/java", "${repo}/android/app/src/play/java"]
   java.exclude { details -> details.file.absolutePath.replace('\\', '/').contains('/src/main/java/') && details.file.name.startsWith('ApkUpdate') }
   java.exclude { details -> details.file.absolutePath.replace('\\', '/').endsWith('/src/main/java/app/kinnect/live/Distribution.java') }
   java.exclude { details ->
    def p = details.file.absolutePath.replace('\\', '/')
    p.contains('/src/main/java/app/kinnect/live/') && (details.file.name in ['LiveGameService.java', 'LiveGamePicker.java', 'LiveGameLaunch.java', 'GameCommentOverlay.java'])
   }
  }
  direct {
   manifest.srcFile "${repo}/android/build/direct-gradle/AndroidManifest.xml"
   java.srcDirs = ["${repo}/android/app/src/main/java"]
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 packaging { jniLibs { useLegacyPackaging=false } }
}
dependencies {
 implementation files("${repo}/work/android-tools/deps/webrtc/classes.jar")
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 playImplementation 'com.android.billingclient:billing:9.1.0'
 implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
