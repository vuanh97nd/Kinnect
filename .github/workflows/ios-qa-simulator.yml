name: iOS QA Simulator Screenshots

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Capture focus: full, core, a11y, light, matrix or security"
        required: false
        default: ""
  push:
    branches:
      - codex/ios-qa-20261113

permissions:
  contents: write

jobs:
  ios-qa-simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project from ios/project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Prepare log and output directories
        run: |
          mkdir -p dist/ios-ui-review logs

      - name: Capture real iOS Simulator screenshots
        env:
          INPUT_FOCUS: ${{ github.event.inputs.focus }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          FOCUS="${INPUT_FOCUS:-}"
          if [ -z "$FOCUS" ]; then
            MARKER="$(printf '%s' "$COMMIT_MSG" | grep -oE '\[qa-focus:[^]]+\]' | head -n1 || true)"
            if [ -n "$MARKER" ]; then
              FOCUS="${MARKER#\[qa-focus:}"
              FOCUS="${FOCUS%\]}"
            fi
          fi
          export UI_REVIEW_FOCUS="$FOCUS"
          python3 ios/scripts/capture-simulator-screenshots.py 2>&1 | tee logs/ios-qa-simulator.log

      - name: Upload real simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-review-screenshots
          path: dist/ios-ui-review
          if-no-files-found: warn

      - name: Upload capture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-qa-simulator-logs
          path: logs/ios-qa-simulator.log
          if-no-files-found: warn

      # Artifact tải về cần đăng nhập GitHub. Commit thẳng vào repo để ảnh công khai
      # và đọc được từ ngoài (raw.githubusercontent.com) — phục vụ review giao diện.
      - name: Publish screenshots to repo
        if: always()
        run: |
          set -e
          if [ ! -d dist/ios-ui-review ]; then
            echo "Không có ảnh để publish."; exit 0
          fi
          DEST="outputs/ci-shots/run-${{ github.run_number }}"
          mkdir -p "$DEST"
          cp -r dist/ios-ui-review/. "$DEST"/
          # Giữ tối đa 2 lần chụp gần nhất: mỗi lần ~35-120MB, không dọn thì repo
          # phình tới hàng GB (đã lên 583MB sau 12 lần chạy).
          ls -1d outputs/ci-shots/run-* 2>/dev/null | sort -V | head -n -2 | while read -r old; do
            echo "xoá $old"; rm -rf "$old"
          done
          git config user.name  "kinnect-ci"
          git config user.email "ci@kinnect.local"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "Không có thay đổi ảnh."; exit 0
          fi
          git commit -m "chore(qa): publish simulator screenshots for run ${{ github.run_number }} [skip ci]"
          # Workflow build cũng push lên nhánh này, nên push thẳng dễ bị non-fast-forward.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin "HEAD:${{ github.ref_name }}" >/dev/null 2>&1; then
              echo "đã publish ảnh (lần thử $i)"; exit 0
            fi
            echo "push lần $i thất bại, thử lại…"; sleep 5
          done
          echo "::warning::Không publish được ảnh sau 3 lần thử."
