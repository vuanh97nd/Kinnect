name: Android QA Emulator Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-qa-20261113

permissions:
  contents: read

jobs:
  android-emulator-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KINNECT_TOOLS: /tmp/kinnect-android-tools
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare verified toolchain
        run: bash scripts/prepare-android-tools.sh

      - name: Build testing APK
        run: |
          set -o pipefail
          bash scripts/build-apk.sh 2>&1 | tee build-apk.log

      - name: Print build failure log
        if: failure()
        run: |
          if [ -f build-apk.log ]; then cat build-apk.log | tail -n 100; fi

      - name: Verify testing APK
        run: |
          test -f dist/kinnect-live-debug.apk
          ls -lh dist/kinnect-live-debug.apk

      - name: Install Python dependencies for UI validation
        run: pip3 install pillow numpy

      - name: Run Android Emulator & Full Screen Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: python3 scripts/capture-android-emulator.py

      - name: Upload Emulator Screenshots & Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshots
          path: |
            outputs/qa-20261112/android/screenshots
            outputs/qa-20261112/android/manifest.json
            outputs/qa-20261112/android/screen-inventory.csv
          if-no-files-found: warn
