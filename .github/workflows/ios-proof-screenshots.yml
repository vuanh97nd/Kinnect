name: iOS Proof Screenshots 20261121

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ios-call-timer-reactions-20261121
    paths:
      - 'ios/**'
      - '.github/workflows/ios-proof-screenshots.yml'

permissions:
  contents: read

jobs:
  capture-proof:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/Kinnect.xcodeproj \
            -scheme Kinnect \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -n 60

      - name: Boot Simulator and Capture Fixed + Deep Audit Screenshots
        run: |
          set -e
          mkdir -p dist/ios-proof
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for rt, devs in sorted(data.items(), reverse=True):
              if 'iOS' not in rt: continue
              for d in devs:
                  if 'iPhone 16' in d['name'] or 'iPhone 15' in d['name'] or 'iPhone' in d['name']:
                      print(d['udid']); sys.exit(0)
          ")
          echo "Using simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          APP_PATH=$(find build/sim/Build/Products/Debug-iphonesimulator -name "Kinnect.app" -maxdepth 2 | head -n 1)
          xcrun simctl install "$UDID" "$APP_PATH"

          capture() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" app.kinnect.live 2>/dev/null || true
            xcrun simctl launch "$UDID" app.kinnect.live -AppleLanguages "(vi)" "$@"
            sleep 2.5
            xcrun simctl io "$UDID" screenshot "dist/ios-proof/${name}.png"
          }

          # 7 Fixed screens (verify every fix)
          capture "fix_01_discover" --ui-review-screen discover
          capture "fix_02_messages_list" --ui-review-screen messages
          capture "fix_03_group_chat" --ui-review-screen group-chat-detail
          capture "fix_04_friends" --ui-review-screen friends
          capture "fix_05_friends_requests" --ui-review-screen friends-requests
          capture "fix_06_wallet" --ui-review-screen wallet
          capture "fix_07_store_packages" --ui-review-screen store

          # 7 New deep-detail screens (Pro UI audit wave 2)
          capture "deep_08_profile_albums" --ui-review-screen profile-albums
          capture "deep_09_profile_private_album" --ui-review-screen profile-private-album
          capture "deep_10_profile_sessions" --ui-review-screen profile-sessions
          capture "deep_11_camera_studio" --ui-review-screen camera-studio
          capture "deep_12_wallet_topup" --ui-review-screen wallet-topup
          capture "deep_13_change_password" --ui-review-screen change-password
          capture "deep_14_support" --ui-review-screen support

          ls -lh dist/ios-proof/

      - name: Upload Proof Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-proof-screenshots
          path: dist/ios-proof
          if-no-files-found: warn
