name: iOS Proof Screenshots 20261121

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ios-call-timer-reactions-20261121
    paths:
      - 'ios/**'
      - '.github/workflows/ios-proof-screenshots.yml'

permissions:
  contents: read

jobs:
  capture-proof:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/Kinnect.xcodeproj \
            -scheme Kinnect \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -n 60

      - name: Boot Simulator and Capture Wave 3 (Light Mode + Deep Modals)
        run: |
          set -e
          mkdir -p dist/ios-proof
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for rt, devs in sorted(data.items(), reverse=True):
              if 'iOS' not in rt: continue
              for d in devs:
                  if 'iPhone 16' in d['name'] or 'iPhone 15' in d['name'] or 'iPhone' in d['name']:
                      print(d['udid']); sys.exit(0)
          ")
          echo "Using simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find build/sim/Build/Products/Debug-iphonesimulator -name "Kinnect.app" -maxdepth 2 | head -n 1)
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl privacy "$UDID" grant all app.kinnect.live || true

          capture() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" app.kinnect.live 2>/dev/null || true
            xcrun simctl launch "$UDID" app.kinnect.live -AppleLanguages "(vi)" "$@"
            sleep 2.5
            xcrun simctl io "$UDID" screenshot "dist/ios-proof/${name}.png"
          }

          # 6 Light Mode screens
          xcrun simctl ui "$UDID" appearance light || true
          capture "light_01_feed" --ui-review-screen feed --ui-review-light
          capture "light_02_discover" --ui-review-screen discover --ui-review-light
          capture "light_03_messages" --ui-review-screen messages --ui-review-light
          capture "light_04_profile" --ui-review-screen profile --ui-review-light
          capture "light_05_wallet" --ui-review-screen wallet --ui-review-light
          capture "light_06_store" --ui-review-screen store --ui-review-light

          # 10 Deep Dark Mode Modals & Settings
          xcrun simctl ui "$UDID" appearance dark || true
          capture "deep_07_auth_register" --ui-review-screen auth-register
          capture "deep_08_auth_reset" --ui-review-screen auth-reset
          capture "deep_09_wallet_topup" --ui-review-screen wallet-topup
          capture "deep_10_change_password" --ui-review-screen change-password
          capture "deep_11_support" --ui-review-screen support
          capture "deep_12_blocked_users" --ui-review-screen blocked-users
          capture "deep_13_delete_account" --ui-review-screen delete-account
          capture "deep_14_ugc_report" --ui-review-screen ugc-report
          capture "deep_15_privacy_consent" --ui-review-screen privacy-consent
          capture "deep_16_camera_studio_edit" --ui-review-screen camera-studio-edit

          ls -lh dist/ios-proof/

      - name: Upload Proof Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-proof-screenshots
          path: dist/ios-proof
          if-no-files-found: warn
