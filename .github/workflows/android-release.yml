name: Publish Android testing APK
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KINNECT_TOOLS: /tmp/kinnect-android-tools
    steps:
      - name: Preserve a manually published APK
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | any(.name | endswith(".apk"))' 2>/dev/null | grep -qx true; then
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
          else
            echo "prebuilt=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.existing.outputs.prebuilt != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.existing.outputs.prebuilt != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified Android toolchain
        if: steps.existing.outputs.prebuilt != 'true'
        run: bash scripts/prepare-android-tools.sh
      - name: Test server URL selection
        if: steps.existing.outputs.prebuilt != 'true'
        run: bash scripts/test-android-config.sh
      - name: Restore stable signing key
        if: steps.existing.outputs.prebuilt != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # Never publish a new random key: Android would reject the upgrade.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing ANDROID_KEYSTORE_B64. Configure the existing signing key or upload a locally signed APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/debug.keystore
      - name: Parse all vectors with the AndroidX parser
        if: steps.existing.outputs.prebuilt != 'true'
        run: python3 scripts/test-native-vector-parser.py
      - name: Build and verify signed testing APK
        if: steps.existing.outputs.prebuilt != 'true'
        run: |
          bash scripts/build-apk.sh
          "$KINNECT_TOOLS/android/android-15/apksigner" verify --verbose --print-certs dist/kinnect-live-debug.apk
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("android/app/src/main/AndroidManifest.xml").getroot().get("{http://schemas.android.com/apk/res/android}versionName"))')"
          test "$GITHUB_REF_NAME" = "v$version"
          cp dist/kinnect-live-debug.apk "dist/Kinnect-$version-debug.apk"
          (cd dist && sha256sum "Kinnect-$version-debug.apk" > "Kinnect-$version-debug.apk.sha256")
      - name: Enforce native-only app and web design assets
        if: steps.existing.outputs.prebuilt != 'true'
        run: python3 scripts/test-native-design.py --apk dist/kinnect-live-debug.apk
      - name: Publish browser-downloadable release
        if: steps.existing.outputs.prebuilt != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/Kinnect-$version-debug.apk" "dist/Kinnect-$version-debug.apk.sha256" --verify-tag --prerelease --title "Kinnect $version — Android thử nghiệm" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
      - name: Remove temporary signing key
        if: always()
        run: rm -f android/debug.keystore
