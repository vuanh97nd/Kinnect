name: Android Full UI Audit 20261121

on:
  workflow_dispatch:
  push:
    branches:
      - audit/android-ui-20261121

permissions:
  contents: read

jobs:
  android-ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KINNECT_TOOLS: /tmp/kinnect-android-tools
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare Android toolchain
        run: bash scripts/prepare-android-tools.sh

      - name: Build debuggable Android UI audit APK
        run: |
          set -o pipefail
          bash scripts/build-apk.sh 2>&1 | tee build-apk.log
          ls -lh dist/kinnect-live.apk

      - name: Run Pixel 6 API 34 Emulator & Capture 28 Screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: python3 scripts/capture-android-audit-20261121.py

      - name: Upload Android Audit Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-audit-20261121
          path: outputs/audit-android-20261121/*.png
          if-no-files-found: error
