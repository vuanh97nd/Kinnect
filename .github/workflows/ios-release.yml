name: Build Kinnect iOS IPA & UI Review Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'ios/**'
      - 'scripts/prepare-ios-assets.py'
      - '.github/workflows/ios-release.yml'
    tags:
      - 'v[0-9]*'
      - 'ios-v[0-9]*'

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project from ios/project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/Kinnect.xcodeproj \
            -scheme Kinnect \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Kinnect.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log

      - name: Report build error summary
        if: failure()
        run: |
          echo "### ❌ Xcodebuild Failure Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(error:|fatal error:)" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
          if-no-files-found: ignore

      - name: Ad-hoc sign and package IPA for Sideloadly / AltStore
        run: |
          mkdir -p build/Payload dist
          cp -R build/Kinnect.xcarchive/Products/Applications/Kinnect.app build/Payload/Kinnect.app
          codesign --force --deep --sign - --entitlements ios/Kinnect/Resources/Kinnect.entitlements build/Payload/Kinnect.app
          APP_VERSION=$(python3 -c 'import plistlib; p=plistlib.load(open("build/Payload/Kinnect.app/Info.plist","rb")); print(p.get("CFBundleShortVersionString","1.2.16"))')
          APP_BUILD=$(python3 -c 'import plistlib; p=plistlib.load(open("build/Payload/Kinnect.app/Info.plist","rb")); print(p.get("CFBundleVersion","128"))')
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$APP_BUILD" >> $GITHUB_ENV
          cd build
          zip -qry "../dist/Kinnect-${APP_VERSION}-ios.ipa" Payload
          cd ../dist
          cp "Kinnect-${APP_VERSION}-ios.ipa" "Kinnect-${APP_VERSION}-b${APP_BUILD}-ios.ipa"
          cp "Kinnect-${APP_VERSION}-ios.ipa" "Kinnect-${APP_VERSION}-sideload.ipa"
          shasum -a 256 "Kinnect-${APP_VERSION}-ios.ipa" > "Kinnect-${APP_VERSION}-ios.ipa.sha256"
          shasum -a 256 "Kinnect-${APP_VERSION}-b${APP_BUILD}-ios.ipa" > "Kinnect-${APP_VERSION}-b${APP_BUILD}-ios.ipa.sha256"
          shasum -a 256 "Kinnect-${APP_VERSION}-sideload.ipa" > "Kinnect-${APP_VERSION}-sideload.ipa.sha256"
          ls -lh "Kinnect-${APP_VERSION}"*.ipa
          python3 -c 'import json,os,plistlib; p=plistlib.load(open("../build/Payload/Kinnect.app/Info.plist","rb")); json.dump({"commit":os.environ["GITHUB_SHA"],"runId":os.environ["GITHUB_RUN_ID"],"version":p["CFBundleShortVersionString"],"build":p["CFBundleVersion"]},open("build-info.json","w"),indent=2)'

      - name: Upload IPA to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kinnect-${{ env.APP_VERSION || '1.2.16' }}-ios-ipa
          path: |
            dist/Kinnect-*-ios.ipa
            dist/Kinnect-*-b*-ios.ipa
            dist/Kinnect-*-sideload.ipa
            dist/*.sha256
            dist/build-info.json
          if-no-files-found: error

      - name: Publish downloadable IPA to GitHub Release (ios-v1.2.16)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${APP_VERSION:-1.2.16}"
          BLD="${APP_BUILD:-128}"
          TAG="${GITHUB_REF_NAME:-ios-v${VER}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Kinnect iOS ${VER} (Build ${BLD})" \
              --notes "Gói cài đặt Kinnect iOS ${VER} Build ${BLD} (.ipa) — Hoàn thiện chuẩn HIG, tương phản Light Mode, VoiceOver, StoreKit, an toàn UGC Livestream và xác nhận thao tác."
            gh release upload "$TAG" \
              "dist/Kinnect-${VER}-ios.ipa" \
              "dist/Kinnect-${VER}-b${BLD}-ios.ipa" \
              "dist/Kinnect-${VER}-sideload.ipa" \
              dist/*.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              "dist/Kinnect-${VER}-ios.ipa" \
              "dist/Kinnect-${VER}-b${BLD}-ios.ipa" \
              "dist/Kinnect-${VER}-sideload.ipa" \
              dist/*.sha256 \
              --title "Kinnect iOS ${VER} (Build ${BLD})" \
              --notes "Gói cài đặt Kinnect iOS (.ipa) — Cài đặt lên iPhone/iPad từ Windows qua Sideloadly hoặc AltStore bằng Apple ID cá nhân miễn phí." \
              --prerelease
          fi
