name: Build Kinnect iOS IPA & UI Review Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'ios/**'
      - 'scripts/prepare-ios-assets.py'
      - '.github/workflows/ios-release.yml'
    tags:
      - 'v[0-9]*'
      - 'ios-v[0-9]*'

permissions:
  contents: write

jobs:
  test-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check design token contrast (WCAG AA)
        run: node tools/check-contrast.mjs

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project from ios/project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Run KinnectTests on iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Kinnect.xcodeproj \
            -scheme Kinnect \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:KinnectTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-test-log
          path: test.log
          if-no-files-found: ignore

  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project from ios/project.yml
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/Kinnect.xcodeproj \
            -scheme Kinnect \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Kinnect.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log

      - name: Report build error summary
        if: failure()
        run: |
          echo "### ❌ Xcodebuild Failure Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(error:|fatal error:)" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Log build fail cần đăng nhập GitHub mới xem được. Commit phần lỗi vào repo
      # để bất kỳ ai (kể cả agent không có token) đọc được nguyên nhân.
      - name: Publish build errors to repo
        if: failure()
        run: |
          DEST="outputs/ci-logs/run-${{ github.run_number }}.txt"
          mkdir -p outputs/ci-logs
          {
            echo "run: ${{ github.run_number }}  sha: ${{ github.sha }}  ref: ${{ github.ref_name }}"
            echo "workflow: ios-release / build-ios"
            echo
            if [ -f build.log ]; then
              echo "---- error lines ----"
              grep -E "(error:|fatal error:|The following build commands failed)" build.log | head -n 80 || echo "(không có dòng error:)"
              echo
              echo "---- last 60 lines ----"
              tail -n 60 build.log
            else
              echo "(build.log không tồn tại — build fail trước bước archive)"
            fi
          } > "$DEST"

          git config user.name  "kinnect-ci"
          git config user.email "ci@kinnect.local"
          git add "$DEST"
          git commit -m "chore(ci): publish build errors for run ${{ github.run_number }} [skip ci]" || { echo "không có gì để commit"; exit 0; }

          # Nhánh này còn nhận push từ workflow screenshots nên push thẳng rất dễ bị
          # non-fast-forward và bị nuốt lỗi. Thử rebase rồi push, lặp 3 lần.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" >/dev/null 2>&1 \
               && git push origin "HEAD:${{ github.ref_name }}" >/dev/null 2>&1; then
              echo "đã publish log (lần thử $i)"; exit 0
            fi
            echo "push lần $i thất bại, thử lại…"
            sleep 5
          done
          echo "::warning::Không publish được build log sau 3 lần thử."
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
          if-no-files-found: ignore

      - name: Ad-hoc sign and package IPA for Sideloadly / AltStore
        run: |
          mkdir -p build/Payload dist
          cp -R build/Kinnect.xcarchive/Products/Applications/Kinnect.app build/Payload/Kinnect.app
          codesign --force --deep --sign - --entitlements ios/Kinnect/Resources/Kinnect.entitlements build/Payload/Kinnect.app
          cd build
          zip -qry "../dist/Kinnect-1.2.12-ios.ipa" Payload
          cd ../dist
          cp "Kinnect-1.2.12-ios.ipa" "Kinnect-1.2.12-b124-ios.ipa"
          cp "Kinnect-1.2.12-ios.ipa" "Kinnect-1.2.12-sideload.ipa"
          shasum -a 256 "Kinnect-1.2.12-ios.ipa" > "Kinnect-1.2.12-ios.ipa.sha256"
          shasum -a 256 "Kinnect-1.2.12-b124-ios.ipa" > "Kinnect-1.2.12-b124-ios.ipa.sha256"
          shasum -a 256 "Kinnect-1.2.12-sideload.ipa" > "Kinnect-1.2.12-sideload.ipa.sha256"
          ls -lh Kinnect-1.2.12*.ipa
          python3 -c 'import json,os,plistlib; p=plistlib.load(open("../build/Payload/Kinnect.app/Info.plist","rb")); json.dump({"commit":os.environ["GITHUB_SHA"],"runId":os.environ["GITHUB_RUN_ID"],"version":p["CFBundleShortVersionString"],"build":p["CFBundleVersion"]},open("build-info.json","w"),indent=2)'

      - name: Upload IPA to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kinnect-1.2.12-ios-ipa
          path: |
            dist/Kinnect-1.2.12-ios.ipa
            dist/Kinnect-1.2.12-b124-ios.ipa
            dist/Kinnect-1.2.12-sideload.ipa
            dist/*.sha256
            dist/build-info.json
          if-no-files-found: error

      - name: Publish downloadable IPA to GitHub Release (ios-v1.2.12)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-v1.2.12"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Kinnect iOS 1.2.12 (Build 122)" \
              --notes "Gói cài đặt Kinnect iOS 1.2.12 Build 122 (.ipa) — Đồng bộ toàn diện Android 1.2.12 (Build 118). Thiết kế tách riêng độc lập Ví Kinnect và Cửa hàng Kinnect theo chuẩn Android. Mở toàn màn hình tất cả các mục chính (Tin nhắn, Thông báo, Cửa hàng, Ví Kinnect, Bạn bè, Hồ sơ), camera viewfinder phần cứng AVFoundation, hiển thị chân dung đầy đủ không bị cắt đầu, sửa lỗi thoát app khi đăng nhập."
            gh release upload "$TAG" \
              dist/Kinnect-1.2.12-ios.ipa \
              dist/Kinnect-1.2.12-b122-ios.ipa \
              dist/Kinnect-1.2.12-sideload.ipa \
              dist/*.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              dist/Kinnect-1.2.12-ios.ipa \
              dist/Kinnect-1.2.12-b122-ios.ipa \
              dist/Kinnect-1.2.12-sideload.ipa \
              dist/*.sha256 \
              --title "Kinnect iOS 1.2.12 (Build 122)" \
              --notes "Gói cài đặt Kinnect iOS (.ipa) — Cài đặt lên iPhone/iPad từ Windows qua Sideloadly hoặc AltStore bằng Apple ID cá nhân miễn phí." \
              --prerelease
          fi

  archive-signed:
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: false
    if: startsWith(github.ref, 'refs/tags/ios-v')
    env:
      SIGNING_READY: ${{ secrets.ASC_KEY != '' && secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        if: env.SIGNING_READY == 'true'
        uses: actions/checkout@v4

      - name: Ensure XcodeGen is installed
        if: env.SIGNING_READY == 'true'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project from ios/project.yml
        if: env.SIGNING_READY == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Import signing certificate and provisioning profile
        if: env.SIGNING_READY == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build and export signed iOS Archive
        if: env.SIGNING_READY == 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_KEY" | base64 --decode -o "$KEY_PATH" 2>/dev/null || printf "%s" "$ASC_KEY" > "$KEY_PATH"

          xcodebuild archive \
            -project ios/Kinnect.xcodeproj \
            -scheme Kinnect \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Kinnect-Signed.xcarchive \
            APS_ENVIRONMENT=production \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

          xcodebuild -exportArchive \
            -archivePath build/Kinnect-Signed.xcarchive \
            -exportOptionsPlist ios/ExportOptions-AppStore.plist \
            -exportPath dist-signed \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload signed IPA artifact
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kinnect-signed-ios-ipa
          path: dist-signed/*.ipa
          if-no-files-found: error
