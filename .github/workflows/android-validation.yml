name: Validate native Android
on:
  pull_request:
    paths: ['android/**', 'scripts/*android*', 'scripts/test-native-design.py', 'scripts/test-native-vector-parser.py', 'scripts/build-apk*', '.github/workflows/android-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KINNECT_TOOLS: /tmp/kinnect-android-tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Guard against release-regression flags
        run: |
          set -e
          fail=0
          if grep -rn --exclude=android-validation.yml -- '--debug-mode' scripts/ .github/workflows/ android/app/ 2>/dev/null; then
            echo "::error::--debug-mode xuất hiện lại trong build script. APK phát hành sẽ debuggable."
            fail=1
          fi
          if grep -rn 'MANAGE_OWN_CALLS' android/app/src/main/AndroidManifest.xml 2>/dev/null; then
            echo "::error::MANAGE_OWN_CALLS là quyền không dùng, không được thêm lại."
            fail=1
          fi
          if grep -n 'android:name=".IncomingCallActivity" android:exported="true"' android/app/src/main/AndroidManifest.xml 2>/dev/null; then
            echo "::error::IncomingCallActivity phải là exported=false (tránh UI hijacking)."
            fail=1
          fi
          exit $fail
      - name: Prepare verified toolchain
        run: bash scripts/prepare-android-tools.sh
      - name: Run JVM audit suite (no emulator)
        run: bash scripts/run-jvm-tests.sh
      - name: Test native policies
        run: bash scripts/test-android-config.sh
      - name: Parse all vectors with the AndroidX parser
        run: python3 scripts/test-native-vector-parser.py
      - name: Build testing APK
        run: bash scripts/build-apk.sh
      - name: Check web design export and native-only APK
        run: python3 scripts/test-native-design.py --apk dist/kinnect-live.apk
