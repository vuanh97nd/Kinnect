name: Validate native Android
on:
  pull_request:
    paths: ['android/**', 'scripts/*android*', 'scripts/build-apk*', '.github/workflows/android-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KINNECT_TOOLS: /tmp/kinnect-android-tools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified toolchain
        run: bash scripts/prepare-android-tools.sh
      - name: Test native policies
        run: bash scripts/test-android-config.sh
      - name: Build testing APK
        run: bash scripts/build-apk.sh
