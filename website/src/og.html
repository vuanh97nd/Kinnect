<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#6d4aff 0%,#b23cf0 55%,#ff4f9a 100%);color:#fff;position:relative}
.ring{position:absolute;border-radius:50%;border:70px solid #ffffff12}
.r1{width:620px;height:620px;right:-120px;top:-200px}.r2{width:400px;height:400px;left:-160px;bottom:-220px}
.copy{position:absolute;left:84px;top:110px;width:600px}
.logo{display:flex;align-items:center;gap:16px;font-size:44px;font-weight:850;letter-spacing:-1px}
.logo img{width:72px;height:72px;border-radius:20px;box-shadow:0 0 0 4px #ffffff55}
h1{font-size:76px;line-height:1.02;letter-spacing:-2.5px;margin:40px 0 22px;font-weight:850}
p{font-size:28px;margin:0;color:#ffffffe0}
.tags{display:flex;gap:12px;margin-top:34px}.tags span{background:#ffffff26;padding:10px 18px;border-radius:999px;font-size:22px;font-weight:700}
.phone{position:absolute;right:110px;top:60px;width:300px;height:649px;border-radius:46px;background:#121318;padding:10px;transform:rotate(6deg);box-shadow:0 40px 80px #0006}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:37px}
</style></head><body>
<div class="ring r1"></div><div class="ring r2"></div>
<div class="copy">
  <div class="logo"><img src="../dist/icon-192.png" alt="">Kinnect</div>
  <h1>Kết nối đúng gu.<br>Sống đúng mình.</h1>
  <p>Mạng xã hội kết bạn an toàn cho người 18+</p>
  <div class="tags"><span>Miễn phí</span><span>Android</span><span>iPhone</span><span>Máy tính</span></div>
</div>
<div class="phone"><img src="../dist/img/app-feed.jpg" alt=""></div>
</body></html>
