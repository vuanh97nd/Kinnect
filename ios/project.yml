name: Kinnect
options:
  bundleIdPrefix: app.kinnect
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "125.0.0"

settings:
  base:
    MARKETING_VERSION: "1.2.12"
    CURRENT_PROJECT_VERSION: "124"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    COMPRESS_PNG_FILES: YES

targets:
  Kinnect:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Kinnect
        excludes:
          - "**/*.md"
    info:
      path: Kinnect/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kinnect
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations:
          - vi
          - en
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.2.12"
        CFBundleVersion: "124"
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.kinnect.live
            CFBundleURLSchemes:
              - kinnect
        NSCameraUsageDescription: "Kinnect cần quyền truy cập Camera để gọi video, phát trực tiếp (Livestream) và chụp ảnh/quay video đăng bài."
        NSMicrophoneUsageDescription: "Kinnect cần quyền truy cập Micro để truyền âm thanh trong cuộc gọi thoại, video call và livestream."
        NSLocationWhenInUseUsageDescription: "Kinnect sử dụng vị trí khi bạn bật tính năng Quanh đây để tìm bạn bè ở gần."
        NSPhotoLibraryUsageDescription: "Kinnect cần quyền truy cập Thư viện ảnh để bạn chọn ảnh đại diện, ảnh bài viết và video ngắn."
        NSPhotoLibraryAddUsageDescription: "Kinnect cần quyền lưu ảnh và video vào Thư viện ảnh của bạn."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIBackgroundModes:
          - audio
          - voip
          - remote-notification
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kinnect.live
        PRODUCT_NAME: Kinnect
        MARKETING_VERSION: "1.2.12"
        CURRENT_PROJECT_VERSION: "124"
        INFOPLIST_FILE: Kinnect/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Kinnect/Resources/Kinnect.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: WebRTC
        product: WebRTC
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: PhotosUI.framework
      - sdk: CallKit.framework
      - sdk: PushKit.framework
      - sdk: UserNotifications.framework
      - sdk: StoreKit.framework
      - sdk: CoreLocation.framework
      - sdk: Security.framework
      - sdk: CryptoKit.framework
      - sdk: AudioToolbox.framework
      - sdk: AuthenticationServices.framework
