name: Kinnect
options:
  bundleIdPrefix: app.kinnect
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.2.12"
    CURRENT_PROJECT_VERSION: "118"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO

targets:
  Kinnect:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Kinnect
        excludes:
          - "**/*.md"
    info:
      path: Kinnect/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kinnect.live
        PRODUCT_NAME: Kinnect
        INFOPLIST_FILE: Kinnect/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
      - sdk: CallKit.framework
      - sdk: UserNotifications.framework
      - sdk: CoreLocation.framework
      - sdk: AudioToolbox.framework
